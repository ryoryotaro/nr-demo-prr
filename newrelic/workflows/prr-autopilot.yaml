name: prr-autopilot
description: AI assisted Production Readiness Review explanation

workflowInputs:
  service:
    type: String
  demoRunId:
    type: String
  readinessResult:
    type: String
    required: true
  failedChecks:
    type: String
  slackDestinationId:
    type: String
    required: true
    validations:
      - pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        errorMessage: Invalid format. Please provide a valid UUID.
        type: regex
  slackChannel:
    type: String
    required: true

steps:
  - name: routeReadinessResult
    type: switch
    switch:
      - condition: ${{ .workflowInputs.readinessResult == "READY" }}
        next: sendReady
      - condition: ${{ .workflowInputs.readinessResult == "NOT READY" }}
        next: formatFailedChecks
    next: sendUnexpectedResult

  - name: sendReady
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ✅ *Production Readiness Review: READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        All required observability checks passed.

        Autopilot review was not required because the deterministic Observability Contract returned READY.
    next: end

  - name: formatFailedChecks
    type: assign
    inputs:
      text: '${{ .workflowInputs.failedChecks | split(",") | map(gsub("^ +| +$"; "") | "• " + .) | join("\n") }}'
    next: sendNotReadyStarted

  - name: sendNotReadyStarted
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        🔎 Autopilot is reviewing the failed observability checks...
    next: runAutopilot

  - name: runAutopilot
    type: action
    action: newrelic.autopilot.run
    version: '1'
    inputs:
      prompt: |-
        OUTPUT CONTRACT — HIGHEST PRIORITY: Return only one valid JSON object. Do not wrap it in a code fence and do not add text before or after it. Use exactly these four string fields and no others:

        {"telemetryFacts":"...","operationalContext":"...","interpretation":"...","recommendation":"..."}

        Write each value in concise Japanese, approximately 150 characters or fewer. Keep all four values under 600 characters total. Do not put Markdown, headings, tables, bullets, HTML, links, nested JSON, arrays, Entity GUID, Account ID, entity metadata, agent or language version, NRQL, query window, UTC time range, exact timestamps, exact telemetry counts, or a PRR result table in any value.

        Review only failedChecks ${{ .workflowInputs.failedChecks }} for service ${{ .workflowInputs.service }} and demo.run_id ${{ .workflowInputs.demoRunId }}. The deterministic Observability Contract already returned ${{ .workflowInputs.readinessResult }} and is authoritative. Do not re-evaluate, override, or repeat that decision.

        telemetryFacts: include only facts directly verified in telemetry for this run and failedChecks. Do not infer causes.
        operationalContext: include only operational meaning retrieved from relevant Memory. Do not invent rules. If none, use "No relevant Memory was found."
        interpretation: combine verified facts and Memory only to explain reduced investigation or decision capability. Mark uncertainty and do not assert an unverified root cause.
        recommendation: give only minimal checks or remediation directly related to failedChecks.

        This application uses the New Relic Go APM Agent, not OpenTelemetry. Never recommend OpenTelemetry APIs, SDKs, instrumentation, service.name, span.SetAttribute, Collector, propagator, or TraceContext configuration. Do not add CPU, memory utilization, Golden Metrics, throughput, error rate, Logs, Alerts, SLOs, dashboards, infrastructure, Kubernetes, or unrelated dependencies as requirements.
      context:
        - description: service
          value: ${{ .workflowInputs.service }}
        - description: demoRunId
          value: ${{ .workflowInputs.demoRunId }}
        - description: observabilityReadinessResult
          value: ${{ .workflowInputs.readinessResult }}
        - description: failedChecks
          value: ${{ .workflowInputs.failedChecks }}
        - description: accountId
          value: ${{ .workflowConstants.accountId | tostring }}
      selectors:
        - name: error
          expression: .errorMessage
        - name: response
          expression: .response.finalAnswer
    ignoreErrors: true
    next: checkAutopilotResponse

  - name: checkAutopilotResponse
    type: switch
    switch:
      - condition: ${{ (.steps.runAutopilot.outputs.response // "") != "" }}
        next: normalizeAutopilotReview
    next: sendAutopilotFallback

  - name: normalizeAutopilotReview
    type: assign
    inputs:
      json: '${{ (.steps.runAutopilot.outputs.response // "") as $r | if ($r|type)=="object" and (($r.telemetryFacts?|type)=="string") then $r elif ($r|type)=="string" then ($r | try fromjson catch null) elif ($r|type)=="array" then (($r[0].text // "") | try fromjson catch null) elif ($r|type)=="object" and ($r.card.body|type)=="array" then ([ $r.card.body[] | if .type=="Text" then (.value // "") else "" end ] | join("") | try fromjson catch null) elif ($r|type)=="object" and ($r.text|type)=="string" then ($r.text | try fromjson catch null) else null end }}'
    next: formatAutopilotReview

  - name: formatAutopilotReview
    type: assign
    inputs:
      valid: '${{ .steps.normalizeAutopilotReview.outputs.json as $j | ($j|type)=="object" and ($j.telemetryFacts|type)=="string" and ($j.telemetryFacts|length)>0 and ($j.operationalContext|type)=="string" and ($j.operationalContext|length)>0 and ($j.interpretation|type)=="string" and ($j.interpretation|length)>0 and ($j.recommendation|type)=="string" and ($j.recommendation|length)>0 }}'
      text: '${{ .steps.normalizeAutopilotReview.outputs.json as $j | if ($j|type)=="object" and ($j.telemetryFacts|type)=="string" and ($j.operationalContext|type)=="string" and ($j.interpretation|type)=="string" and ($j.recommendation|type)=="string" then (def clean: gsub("[\\r\\n]+"; " ") | gsub("[*#`]"; "") | .[0:150]; "*Telemetry facts*\n• \($j.telemetryFacts|clean)\n\n*Operational context*\n• \($j.operationalContext|clean)\n\n*Interpretation*\n• \($j.interpretation|clean)\n\n*Recommendation*\n• \($j.recommendation|clean)") else "" end as $text | if ($text|length)>850 then $text[0:850] + "\n...\n[Autopilot review truncated for Slack]" else $text end }}'
    next: checkFormattedReview

  - name: checkFormattedReview
    type: switch
    switch:
      - condition: ${{ .steps.formatAutopilotReview.outputs.valid == true and (.steps.formatAutopilotReview.outputs.text // "") != "" }}
        next: sendNotReadyReview
    next: sendAutopilotFormatFallback

  - name: sendNotReadyReview
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        The deterministic Observability Contract returned NOT READY.

        ────────────────────
        *Autopilot Review*
        ────────────────────

        ${{ .steps.formatAutopilotReview.outputs.text }}
    next: end

  - name: sendAutopilotFallback
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        Autopilot review could not be completed.
        The deterministic PRR result remains NOT READY.
    next: end

  - name: sendAutopilotFormatFallback
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        Autopilot review could not be formatted.
        The deterministic PRR result remains NOT READY.
    next: end

  - name: sendUnexpectedResult
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ⚠️ *Production Readiness Review: ERROR*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        Unexpected readiness result received: `${{ .workflowInputs.readinessResult }}`

        Autopilot was not started. Please inspect the deterministic readiness check.
    next: end
