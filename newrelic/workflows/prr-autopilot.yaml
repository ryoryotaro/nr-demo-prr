name: prr-autopilot
description: AI assisted Production Readiness Review explanation

workflowInputs:
  service:
    type: String
  demoRunId:
    type: String
  readinessResult:
    type: String
    required: true
  failedChecks:
    type: String
  readinessEvidence:
    type: String
    required: true
  slackDestinationId:
    type: String
    required: true
    validations:
      - pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        errorMessage: Invalid format. Please provide a valid UUID.
        type: regex
  slackChannel:
    type: String
    required: true

steps:
  - name: routeReadinessResult
    type: switch
    switch:
      - condition: ${{ .workflowInputs.readinessResult == "READY" }}
        next: sendReady
      - condition: ${{ .workflowInputs.readinessResult == "NOT READY" }}
        next: formatFailedChecks
    next: sendUnexpectedResult

  - name: sendReady
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ✅ *Production Readiness Review: READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        All required observability checks passed.

        Autopilot review was not required because the deterministic Observability Contract returned READY.
    next: end

  - name: formatFailedChecks
    type: assign
    inputs:
      text: '${{ .workflowInputs.failedChecks | split(",") | map(gsub("^ +| +$"; "") | "• " + .) | join("\n") }}'
    next: sendNotReadyStarted

  - name: sendNotReadyStarted
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        🔎 Autopilot is reviewing the failed observability checks...
    next: runAutopilot

  - name: runAutopilot
    type: action
    action: newrelic.autopilot.run
    version: '1'
    inputs:
      prompt: |-
        Perform a focused Production Readiness investigation for service ${{ .workflowInputs.service }}.

        ==================================================
        CURRENT RUN IS THE PRIMARY SCOPE
        ==================================================

        The investigation scope is the current PRR run identified by demoRunId = ${{ .workflowInputs.demoRunId }}. This demoRunId is the primary correlation key. Do not evaluate the service using an entity-wide time window. Do not use unrelated telemetry from previous or later demoRunIds as evidence for this run.

        The deterministic Observability Contract already returned ${{ .workflowInputs.readinessResult }}. That result is authoritative. Do not re-evaluate or override it. Investigate only these failed checks: ${{ .workflowInputs.failedChecks }}.

        Authoritative PRR evidence:
        ${{ .workflowInputs.readinessEvidence }}

        This evidence was produced by the deterministic Observability Contract check. Treat these current-run failed-check facts as established. Do not contradict or re-evaluate them using telemetry from other runs.

        A missing attribute or broken trace is a verified telemetry symptom, not a verified implementation root cause. Never label an implementation explanation as "Cause" or "Root cause" unless it is directly proven by current-run evidence. Otherwise explicitly state that the implementation-level cause is unknown and describe possibilities only as inference. Do not include code snippets or prescribe a specific header, function, API, agent setting, or code path that was not directly verified.

        For customer.plan, inspect only checkout telemetry where `demo.run_id` equals the current demoRunId. Never use customer.plan coverage from the service as a whole or from another run as evidence for this run.

        For prr-demo-payment trace continuity, first obtain trace.id values from checkout telemetry scoped to the current demoRunId, then check whether those same trace.id values contain prr-demo-payment. Matching transaction counts, throughput, successful HTTP behavior, response time, or zero error rate are not evidence of distributed trace continuity.

        A time window may be used only as an additional query bound. It must never replace filtering by the current demo.run_id or by trace.id values derived from that run. If telemetry does not carry demo.run_id directly, correlate it using trace.id, transactionId, or another identifier derived from current-run telemetry. If it cannot be correlated, state that its relationship to this run cannot be verified; do not substitute telemetry from another run.

        Functional health and Observability readiness are different. A successful Functional Test or payment HTTP call does not prove that checkout and payment share a distributed trace, and must not weaken an authoritative failed check.

        Distinguish facts verified from current telemetry, relevant operational context retrieved from Memory, interpretation, and recommendations. Do not assert a specific implementation cause unless it is directly verified. If the cause cannot be verified from telemetry, state that the implementation-level cause is unknown.

        This application uses the New Relic Go APM Agent, not OpenTelemetry. Do not recommend OpenTelemetry APIs, SDKs, instrumentation, service.name, span.SetAttribute, Collector, propagator, or TraceContext configuration. Do not add CPU, memory utilization, Golden Metrics, throughput, error rate, Logs, Alerts, SLOs, dashboards, infrastructure, Kubernetes, or unrelated dependencies as readiness requirements.

        Please keep the final investigation concise and focused on the failed checks. Avoid unnecessary entity metadata, account IDs, GUIDs, query windows, exact telemetry counts, code examples, and large tables.
      context:
        - description: service
          value: ${{ .workflowInputs.service }}
        - description: demoRunId
          value: ${{ .workflowInputs.demoRunId }}
        - description: observabilityReadinessResult
          value: ${{ .workflowInputs.readinessResult }}
        - description: failedChecks
          value: ${{ .workflowInputs.failedChecks }}
        - description: authoritativeReadinessEvidence
          value: ${{ .workflowInputs.readinessEvidence }}
        - description: accountId
          value: ${{ .workflowConstants.accountId | tostring }}
      selectors:
        - name: error
          expression: .errorMessage
        - name: response
          expression: .response.finalAnswer
    ignoreErrors: true
    next: checkAutopilotResponse

  - name: checkAutopilotResponse
    type: switch
    switch:
      - condition: ${{ (.steps.runAutopilot.outputs.response // "") != "" }}
        next: sendNotReadyReview
    next: sendAutopilotFallback

  - name: sendNotReadyReview
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      blocks: '${{ (.steps.runAutopilot.outputs.response // "") as $raw | (if ($raw|type)=="string" then ($raw | try fromjson catch $raw) else $raw end) as $r | (if ($r|type)=="object" and ($r.card.body|type)=="array" then [ $r.card.body[] | select(.type=="Text" and (.value|type)=="string") | .value ] elif ($r|type)=="array" then [ $r[] | if (.type=="Text" and (.value|type)=="string") then .value elif (.text|type)=="string" then .text else empty end ] elif ($r|type)=="object" and ($r.text|type)=="string" then [ $r.text ] elif ($r|type)=="string" then [ $r ] else [ $raw|tostring ] end) as $cards | [{"type":"section","text":{"type":"mrkdwn","text":"❌ *Production Readiness Review: NOT READY*\n\n*Service:* \(.workflowInputs.service)\n*Run ID:* \(.workflowInputs.demoRunId)\n\n*Failed checks:*\n\(.steps.formatFailedChecks.outputs.text)\n\nThe deterministic Observability Contract returned NOT READY."}},{"type":"divider"},{"type":"section","text":{"type":"mrkdwn","text":"*Autopilot Investigation*"}},{"type":"divider"}] + ([ $cards[] | [range(0; length; 2900) as $i | .[$i:$i+2900]][] ] | map({"type":"section","text":{"type":"mrkdwn","text":.}}) | reduce .[] as $block ([]; if length==0 then [$block] else . + [{"type":"divider"},$block] end)) }}'
    next: end

  - name: sendAutopilotFallback
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        Autopilot review could not be completed.
        The deterministic PRR result remains NOT READY.
    next: end

  - name: sendUnexpectedResult
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ⚠️ *Production Readiness Review: ERROR*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        Unexpected readiness result received: `${{ .workflowInputs.readinessResult }}`

        Autopilot was not started. Please inspect the deterministic readiness check.
    next: end
