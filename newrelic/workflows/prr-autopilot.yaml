name: prr-autopilot
description: AI assisted Production Readiness Review explanation

workflowInputs:
  service:
    type: String
  demoRunId:
    type: String
  readinessResult:
    type: String
    required: true
  failedChecks:
    type: String
  slackDestinationId:
    type: String
    required: true
    validations:
      - pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        errorMessage: Invalid format. Please provide a valid UUID.
        type: regex
  slackChannel:
    type: String
    required: true

steps:
  - name: routeReadinessResult
    type: switch
    switch:
      - condition: ${{ .workflowInputs.readinessResult == "READY" }}
        next: sendReady
      - condition: ${{ .workflowInputs.readinessResult == "NOT READY" }}
        next: formatFailedChecks
    next: sendUnexpectedResult

  - name: sendReady
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ✅ *Production Readiness Review: READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        All required observability checks passed.

        Autopilot review was not required because the deterministic Observability Contract returned READY.
    next: end

  - name: formatFailedChecks
    type: assign
    inputs:
      text: '${{ .workflowInputs.failedChecks | split(",") | map(gsub("^ +| +$"; "") | "• " + .) | join("\n") }}'
    next: sendNotReadyStarted

  - name: sendNotReadyStarted
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        🔎 Autopilot is reviewing the failed observability checks...
    next: runAutopilot

  - name: runAutopilot
    type: action
    action: newrelic.autopilot.run
    version: '1'
    inputs:
      prompt: |-
        Perform an AI-assisted Production Readiness Review for service ${{ .workflowInputs.service }}, demo.run_id ${{ .workflowInputs.demoRunId }}, in account ${{ .workflowConstants.accountId }}. This review will be posted to Slack.

        The deterministic Observability Contract already returned ${{ .workflowInputs.readinessResult }}. That result is authoritative. Do not re-evaluate or override it. Investigate only these failed checks: ${{ .workflowInputs.failedChecks }}.

        This application uses the New Relic Go APM Agent, not OpenTelemetry. Do not recommend OpenTelemetry APIs, SDKs, instrumentation, Resource attributes, Collector, or TraceContext configuration. Do not add unrelated requirements or discuss Logs, Golden Metrics, CPU, SLOs, Alerts, dashboards, infrastructure, or general service health.

        Strictly separate telemetry facts from inference. Do not claim an implementation cause, HTTP header, agent setting, library, or code path unless directly verified. If the cause is not observable, say that the implementation-level cause is unknown. Use Memory only for operational context directly related to failedChecks; never use it as a readiness rule.

        Respond in Japanese, approximately 700 characters or fewer. Use exactly these four headings and no title, preface, conclusion, or other section:

        ## 1. Verified telemetry facts
        Only facts directly observed for this demo.run_id and failedChecks. No inference, Memory, impact, or recommendation.

        ## 2. Saved operational context from Memory
        Only relevant Memory actually retrieved. If none: No relevant Memory was found.

        ## 3. Interpretation
        Explain only what investigation or decision is difficult because of each missing signal. Clearly mark inference and unknown causes.

        ## 4. Recommendation
        Give only minimal intent-level remediation for failedChecks and rerun with a new demo.run_id. Do not speculate about APIs, headers, settings, or code changes.
      context:
        - description: service
          value: ${{ .workflowInputs.service }}
        - description: demoRunId
          value: ${{ .workflowInputs.demoRunId }}
        - description: observabilityReadinessResult
          value: ${{ .workflowInputs.readinessResult }}
        - description: failedChecks
          value: ${{ .workflowInputs.failedChecks }}
        - description: accountId
          value: ${{ .workflowConstants.accountId | tostring }}
      selectors:
        - name: error
          expression: .errorMessage
        - name: response
          expression: .response.finalAnswer
    ignoreErrors: true
    next: checkAutopilotResponse

  - name: checkAutopilotResponse
    type: switch
    switch:
      - condition: ${{ (.steps.runAutopilot.outputs.response // "") != "" }}
        next: formatAutopilotReview
    next: sendAutopilotFallback

  - name: formatAutopilotReview
    type: assign
    inputs:
      text: '${{ (.steps.runAutopilot.outputs.response // "") as $r | (if ($r|type)=="string" then ($r | try fromjson catch null) else $r end) as $json | (if ($json|type)=="array" then ($json[0].text // ($json | tostring)) elif ($json|type)=="object" and ($json.card.body|type)=="array" then [ $json.card.body[] | if .type=="Text" then (.value // "") else "" end ] | join("\n\n") elif ($json|type)=="object" and ($json.text|type)=="string" then $json.text else ($r | tostring) end) | gsub("\\*\\*"; "*") | gsub("### "; "*") | gsub("## "; "*") as $text | if ($text | length) > 850 then $text[0:850] + "\n...\n[Autopilot review truncated for Slack]" else $text end }}'
    next: sendNotReadyReview

  - name: sendNotReadyReview
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        The deterministic Observability Contract returned NOT READY.

        ────────────────────
        *Autopilot Review*
        ────────────────────

        ${{ .steps.formatAutopilotReview.outputs.text }}
    next: end

  - name: sendAutopilotFallback
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Review: NOT READY*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *Failed checks:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        Autopilot review could not be completed.
        The deterministic PRR result remains NOT READY.
    next: end

  - name: sendUnexpectedResult
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ⚠️ *Production Readiness Review: ERROR*

        *Service:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        Unexpected readiness result received: `${{ .workflowInputs.readinessResult }}`

        Autopilot was not started. Please inspect the deterministic readiness check.
    next: end
