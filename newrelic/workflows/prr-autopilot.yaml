name: prr-autopilot
description: AI assisted Production Readiness Check explanation

workflowInputs:
  service:
    type: String
  demoRunId:
    type: String
  readinessResult:
    type: String
    required: true
  failedChecks:
    type: String
  readinessEvidence:
    type: String
    required: true
  slackDestinationId:
    type: String
    required: true
    validations:
      - pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        errorMessage: Invalid format. Please provide a valid UUID.
        type: regex
  slackChannel:
    type: String
    required: true

steps:
  - name: routeReadinessResult
    type: switch
    switch:
      - condition: ${{ .workflowInputs.readinessResult == "READY" }}
        next: sendReady
      - condition: ${{ .workflowInputs.readinessResult == "NOT READY" }}
        next: formatFailedChecks
    next: sendUnexpectedResult

  - name: sendReady
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ✅ *Production Readiness Check: READY*

        *サービス:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        必須のオブザーバビリティ要件をすべて満たしています。

        決定論的なPRCがREADYと判定したため、Autopilotによる追加調査は実行していません。
    next: end

  - name: formatFailedChecks
    type: assign
    inputs:
      text: '${{ .workflowInputs.failedChecks | split(",") | map(gsub("^ +| +$"; "") | "• " + .) | join("\n") }}'
    next: sendNotReadyStarted

  - name: sendNotReadyStarted
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Check: NOT READY*

        *サービス:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *満たしていない要件:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        🔎 Autopilotが満たしていないオブザーバビリティ要件を追加調査しています...
    next: runAutopilot

  - name: runAutopilot
    type: action
    action: newrelic.autopilot.run
    version: '1'
    inputs:
      prompt: |-
        Perform a focused Production Readiness Check investigation for service ${{ .workflowInputs.service }}.

        ==================================================
        REQUIRED OUTPUT LANGUAGE: JAPANESE
        ==================================================

        Write the entire final answer in Japanese without exception. Write every heading, explanation, analysis, verification result, business impact, recommendation, and next investigation step in Japanese. Even when inputs, telemetry, NRQL results, Memory, or New Relic UI data are in English, do not switch the response body to English.

        Preserve the original English spelling only for service names, attribute names, trace.id, demo.run_id, code, function names, API names, and New Relic-specific product or technical names. Do not translate identifiers such as customer.plan, tenant.id, or prr-demo-payment. If JSON is necessary, write all surrounding explanation in Japanese.

        In the Japanese answer, refer to this deterministic process as "PRC" or "Production Readiness Check", never "PRR" or "Production Readiness Review". Prefer the Japanese phrase "オブザーバビリティ要件" when referring to the Observability Contract requirements.

        ==================================================
        CURRENT RUN IS THE PRIMARY SCOPE
        ==================================================

        The investigation scope is the current PRC run identified by demoRunId = ${{ .workflowInputs.demoRunId }}. This demoRunId is the primary correlation key. Do not evaluate the service using an entity-wide time window. Do not use unrelated telemetry from previous or later demoRunIds as evidence for this run.

        The deterministic Observability Contract already returned ${{ .workflowInputs.readinessResult }}. That result is authoritative. Do not re-evaluate or override it. Investigate only these failed checks: ${{ .workflowInputs.failedChecks }}.

        Authoritative PRC evidence:
        ${{ .workflowInputs.readinessEvidence }}

        This evidence was produced by the deterministic Observability Contract check. Treat these current-run failed-check facts as established. Do not contradict or re-evaluate them using telemetry from other runs.

        A missing attribute or broken trace is a verified telemetry symptom, not a verified implementation root cause. Never label an implementation explanation as "Cause" or "Root cause" unless it is directly proven by current-run evidence. Otherwise explicitly state in Japanese that the implementation-level cause is unknown and describe possibilities only as inference or investigation candidates. Do not include code snippets or prescribe a specific header, function, API, agent setting, or code path that was not directly verified. In particular, do not state that W3C TraceContext headers were not propagated, newrelic.NewRoundTripper was not used, DistributedTracer.Enabled was disabled, or an Enterprise SLA violation is likely unless current-run evidence directly proves that statement.

        For customer.plan, inspect only checkout telemetry where `demo.run_id` equals the current demoRunId. Never use customer.plan coverage from the service as a whole or from another run as evidence for this run.

        For prr-demo-payment trace continuity, first obtain trace.id values from checkout telemetry scoped to the current demoRunId, then check whether those same trace.id values contain prr-demo-payment. Matching transaction counts, throughput, successful HTTP behavior, response time, or zero error rate are not evidence of distributed trace continuity.

        A time window may be used only as an additional query bound. It must never replace filtering by the current demo.run_id or by trace.id values derived from that run. If telemetry does not carry demo.run_id directly, correlate it using trace.id, transactionId, or another identifier derived from current-run telemetry. If it cannot be correlated, state that its relationship to this run cannot be verified; do not substitute telemetry from another run.

        Functional health and Observability readiness are different. A successful Functional Test or payment HTTP call does not prove that checkout and payment share a distributed trace, and must not weaken an authoritative failed check.

        Distinguish facts verified from current telemetry, relevant operational context retrieved from Memory, interpretation, and recommendations. Do not assert a specific implementation cause unless it is directly verified. If the cause cannot be verified from telemetry, state that the implementation-level cause is unknown.

        This application uses the New Relic Go APM Agent, not OpenTelemetry. Do not recommend OpenTelemetry APIs, SDKs, instrumentation, service.name, span.SetAttribute, Collector, propagator, or TraceContext configuration. Do not add CPU, memory utilization, Golden Metrics, throughput, error rate, Logs, Alerts, SLOs, dashboards, infrastructure, Kubernetes, or unrelated dependencies as readiness requirements.

        Please keep the final investigation concise and focused on the failed checks. Avoid unnecessary entity metadata, account IDs, GUIDs, query windows, exact telemetry counts, code examples, and large tables.
      context:
        - description: service
          value: ${{ .workflowInputs.service }}
        - description: demoRunId
          value: ${{ .workflowInputs.demoRunId }}
        - description: observabilityReadinessResult
          value: ${{ .workflowInputs.readinessResult }}
        - description: failedChecks
          value: ${{ .workflowInputs.failedChecks }}
        - description: authoritativeReadinessEvidence
          value: ${{ .workflowInputs.readinessEvidence }}
        - description: accountId
          value: ${{ .workflowConstants.accountId | tostring }}
      selectors:
        - name: error
          expression: .errorMessage
        - name: response
          expression: .response.finalAnswer
    ignoreErrors: true
    next: checkAutopilotResponse

  - name: checkAutopilotResponse
    type: switch
    switch:
      - condition: ${{ (.steps.runAutopilot.outputs.response // "") != "" }}
        next: sendNotReadyReview
    next: sendAutopilotFallback

  - name: sendNotReadyReview
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      blocks: '${{ (.steps.runAutopilot.outputs.response // "") as $raw | (if ($raw|type)=="string" then ($raw | try fromjson catch $raw) else $raw end) as $r | (if ($r|type)=="object" and ($r.card.body|type)=="array" then [ $r.card.body[] | select(.type=="Text" and (.value|type)=="string") | .value ] elif ($r|type)=="array" then [ $r[] | if (.type=="Text" and (.value|type)=="string") then .value elif (.text|type)=="string" then .text else empty end ] elif ($r|type)=="object" and ($r.text|type)=="string" then [ $r.text ] elif ($r|type)=="string" then [ $r ] else [ $raw|tostring ] end) as $cards | [{"type":"section","text":{"type":"mrkdwn","text":"❌ *Production Readiness Check: NOT READY*\n\n*サービス:* \(.workflowInputs.service)\n*Run ID:* \(.workflowInputs.demoRunId)\n\n*満たしていない要件:*\n\(.steps.formatFailedChecks.outputs.text)\n\n決定論的なPRCの正式な判定はNOT READYです。"}},{"type":"divider"},{"type":"section","text":{"type":"mrkdwn","text":"*Autopilot追加調査*"}},{"type":"divider"}] + ([ $cards[] | [range(0; length; 2900) as $i | .[$i:$i+2900]][] ] | map({"type":"section","text":{"type":"mrkdwn","text":.}}) | reduce .[] as $block ([]; if length==0 then [$block] else . + [{"type":"divider"},$block] end)) }}'
    next: end

  - name: sendAutopilotFallback
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ❌ *Production Readiness Check: NOT READY*

        *サービス:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        *満たしていない要件:*
        ${{ .steps.formatFailedChecks.outputs.text }}

        Autopilotによる追加調査を完了できませんでした。
        決定論的なPRCの正式な判定はNOT READYのままです。
    next: end

  - name: sendUnexpectedResult
    type: action
    action: newrelic.notification.sendSlack
    version: 1
    inputs:
      destinationId: ${{ .workflowInputs.slackDestinationId }}
      channel: ${{ .workflowInputs.slackChannel }}
      text: |-
        ⚠️ *Production Readiness Check: ERROR*

        *サービス:* ${{ .workflowInputs.service }}
        *Run ID:* ${{ .workflowInputs.demoRunId }}

        予期しない判定結果を受信しました: `${{ .workflowInputs.readinessResult }}`

        Autopilotは実行していません。決定論的なPRCを確認してください。
    next: end
